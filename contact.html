<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יצירת קשר | JobNet VIP מחשבון שכר</title>
  <meta name="description" content="יצירת קשר עם צוות JobNet VIP. פניות בנושאי דיוק חישובים, הצעות לשיפור, נגישות ושיתופי פעולה.">
  <link rel="canonical" href="https://jobnet.vip/contact.html">

  <!-- חיבור לתשתית המרכזית -->
  <link rel="stylesheet" href="/style.css">
  <script src="/common.js" defer></script>
</head>
<body>

  <main class="container">
    <div class="card">
      <h2>טופס יצירת קשר</h2>
      <p>מצאתם אי-דיוק בחישוב? יש לכם הצעה לשיפור הסימולטור או פנייה בנושא נגישות? מלאו את הטופס ונחזור אליכם בהקדם.</p>

      <form id="contactForm">
        <div class="field">
          <label for="name">שם מלא / כינוי</label>
          <input type="text" id="name" name="name" required placeholder="ישראל ישראלי">
        </div>

        <div class="field">
          <label for="email">כתובת אימייל למענה</label>
          <input type="email" id="email" name="email" required placeholder="yourname@example.com">
        </div>

        <div class="field">
          <label for="subject">נושא הפנייה</label>
          <select id="subject" name="subject">
            <option value="משוב על המחשבון">משוב / דיוק חישוב שכר</option>
            <option value="פנייה בנושא נגישות">פנייה לרכז הנגישות</option>
            <option value="הצעת שיתוף פעולה">שיתוף פעולה / הטמעת מחשבון</option>
            <option value="אחר">אחר</option>
          </select>
        </div>

        <div class="field">
          <label for="message">תוכן ההודעה</label>
          <textarea id="message" name="message" required placeholder="כתבו כאן את פרטי פנייתכם..." style="min-height: 120px;"></textarea>
        </div>

        <button type="submit" id="submitBtn" style="width: 100%; background: var(--accent); color: #07090e; border: none; border-radius: 8px; padding: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s;">שליחת הודעה</button>
        <div id="statusMsg" style="margin-top: 14px; text-align: center; font-size: 0.95rem; font-weight: 600; display: none;"></div>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';
      statusMsg.style.display = 'none';

      const data = new FormData(form);
      try {
        const response = await fetch('https://formsubmit.co/ajax/jobnet@gmail.com', {
          method: 'POST',
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });
        if (response.ok) {
          statusMsg.textContent = 'תודה! הודעתך נשלחה בהצלחה ונענה בהקדם.';
          statusMsg.style.color = '#00e699';
          statusMsg.style.display = 'block';
          form.reset();
        } else {
          statusMsg.textContent = 'חלה שגיאה בשליחה. אנא נסה שוב מאוחר יותר.';
          statusMsg.style.color = '#ef4444';
          statusMsg.style.display = 'block';
        }
      } catch (err) {
        statusMsg.textContent = 'שגיאת תקשורת. אנא בדוק את החיבור לרשת ונסה שוב.';
        statusMsg.style.color = '#ef4444';
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'שליחת הודעה';
      }
    });
  </script>
</body>
</html>
