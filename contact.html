<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יצירת קשר | jobnet.vip</title>
  <meta name="description" content="יצירת קשר עם צוות jobnet.vip בכל שאלה, הצעה לשיתוף פעולה או משוב על מערכות חישוב השכר.">
  <link rel="canonical" href="https://jobnet.vip/contact">

  <link rel="stylesheet" href="./style.css">
  <script src="./common.js" defer></script>
</head>
<body>

  <main class="container">
    <div class="card">
      <h2>📬 יצירת קשר עם צוות המיזם</h2>
      <p>יש לכם שאלה מקצועית, הערה לגבי סימולציות השכר או הצעה לשיפור הכלים? נשמח לשמוע מכם.</p>

      <form id="contactForm" style="margin-top: 24px;">
        <div class="field">
          <label for="contactName">שם מלא:</label>
          <input type="text" id="contactName" name="שם מלא" required placeholder="השם שלכם">
        </div>

        <div class="field">
          <label for="contactEmail">כתובת אימייל לתשובה:</label>
          <input type="email" id="contactEmail" name="כתובת אימייל לתשובה" required placeholder="yourname@domain.com">
        </div>

        <div class="field">
          <label for="contactSubject">נושא הפנייה:</label>
          <select id="contactSubject" name="נושא הפנייה">
            <option value="משוב כללי על המחשבונים">משוב כללי על המחשבונים</option>
            <option value="הצעת שיתוף פעולה / הטמעה">הצעת שיתוף פעולה / הטמעה</option>
            <option value="דיווח על אי-דיוק בחישוב">דיווח על אי-דיוק בחישוב</option>
            <option value="סריקת קו&quot;ח ב-AI">סריקת קו"ח ב-AI</option>
            <option value="אחר">אחר</option>
          </select>
        </div>

        <div class="field">
          <label for="contactMsg">תוכן ההודעה:</label>
          <textarea id="contactMsg" name="תוכן ההודעה" required placeholder="כתבו כאן את פנייתכם בפירוט..."></textarea>
        </div>

        <button type="submit" id="btnSubmitContact" class="btn-action" style="width: 100%;">
          ✉️ שליחת הודעה
        </button>
      </form>

      <div id="contactSuccess" style="display: none; background: rgba(0, 230, 153, 0.12); border: 1px solid var(--success); color: var(--success); padding: 18px; border-radius: 14px; text-align: center; margin-top: 20px; font-weight: 700;">
        ✓ פנייתך נשלחה בהצלחה! נחזור אליך בהקדם האפשרי.
      </div>
      <div id="contactError" style="display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger); color: #fca5a5; padding: 18px; border-radius: 14px; text-align: center; margin-top: 20px; font-weight: 700;">
        ⚠️ אירעה שגיאה בשליחת הטופס. אנא פנו ישירות לכתובת המייל של האתר.
      </div>
    </div>
  </main>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitContact');
      btn.disabled = true;
      btn.textContent = 'שולח...';

      const selectedSubject = document.getElementById('contactSubject').value;

      const formData = {
        "_subject": `************* הודעה לצוות JOBNET [${selectedSubject}] *************`,
        "_template": "table",
        "שם מלא": document.getElementById('contactName').value,
        "כתובת אימייל לתשובה": document.getElementById('contactEmail').value,
        "נושא הפנייה": selectedSubject,
        "תוכן ההודעה": document.getElementById('contactMsg').value
      };

      fetch('https://formsubmit.co/ajax/jobnet@gmail.com', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(formData)
      })
      .then(res => {
        if (res.ok) {
          document.getElementById('contactForm').style.display = 'none';
          document.getElementById('contactSuccess').style.display = 'block';
        } else {
          throw new Error('Network error');
        }
      })
      .catch(() => {
        btn.disabled = false;
        btn.textContent = '✉️ שליחת הודעה';
        document.getElementById('contactError').style.display = 'block';
      });
    });
  </script>
</body>
</html>
