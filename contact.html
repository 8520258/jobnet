<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יצירת קשר עם צוות המיזם | jobnet.vip</title>
  <meta name="description" content="צרו קשר עם צוות jobnet.vip להצעות, שאלות מקצועיות, הצעות לשיתופי פעולה ודיוק סימולטורים פיננסיים.">
  <link rel="canonical" href="https://jobnet.vip/contact">

  <meta property="og:title" content="יצירת קשר | jobnet.vip">
  <meta property="og:description" content="פנייה לצוות הפיתוח והתוכן של jobnet.vip.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jobnet.vip/contact">

  <link rel="stylesheet" href="./style.css">
  <script src="./common.js" defer></script>

  <style>
    .contact-container {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    .form-status {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 16px;
      text-align: center;
      font-weight: 500;
    }
    .form-status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
    }
    .form-status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    textarea {
      width: 100%;
      height: 140px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #f3f4f6;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      box-sizing: border-box;
      line-height: 1.5;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "יצירת קשר עם צוות jobnet.vip",
    "url": "https://jobnet.vip/contact"
  }
  </script>
</head>
<body>

  <main class="contact-container no-print">
    <section class="card">
      <h2 style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span>📬</span> יצירת קשר עם צוות המיזם
      </h2>
      <p style="text-align: center; color: var(--muted); margin-top: -6px; margin-bottom: 24px; font-size: 0.92rem;">
        יש לכם שאלה מקצועית, הערה לגבי סימולציות השכר או הצעה לשיפור הכלים? נשמח לשמוע מכם.
      </p>

      <form id="contactForm">
        <div class="field">
          <label for="senderName">שם מלא:</label>
          <input type="text" id="senderName" name="name" required placeholder="השם שלכם">
        </div>

        <div class="field">
          <label for="senderEmail">כתובת אימייל לתשובה:</label>
          <input type="email" id="senderEmail" name="email" required placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="subjectSelect">נושא הפנייה:</label>
          <select id="subjectSelect" name="subject">
            <option value="משוב / דיוק חישוב שכר" selected>משוב / דיוק חישוב שכר ומסים</option>
            <option value="הצעת שיתוף פעולה / הטמעה">הצעת שיתוף פעולה / הטמעה</option>
            <option value="דיווח על תקלה טכנית">דיווח על תקלה טכנית באתר</option>
            <option value="שאלה כללית בנושא דיני עבודה">שאלה כללית בנושא דיני עבודה</option>
          </select>
        </div>

        <div class="field">
          <label for="messageText">תוכן ההודעה:</label>
          <textarea id="messageText" name="message" required placeholder="כתבו כאן את פנייתכם בפירוט..."></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="btn-primary" style="width: 100%; margin-top: 10px; padding: 13px; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <span>📨</span> שלח הודעה
        </button>

        <div id="statusMsg" class="form-status"></div>
      </form>
    </section>
  </main>

  <script>
    // כתובת ה-Web App של Google Apps Script לשליחת המייל
    // אם יש לך כתובת Deployment ספציפית ב-Apps Script, עדכן אותה כאן:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYOUR_DEPLOYMENT_ID/exec';

    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('statusMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>⏳</span> שולח הודעה...';
      statusMsg.className = 'form-status';
      statusMsg.style.display = 'none';

      const data = {
        name: document.getElementById('senderName').value.trim(),
        email: document.getElementById('senderEmail').value.trim(),
        subject: document.getElementById('subjectSelect').value,
        message: document.getElementById('messageText').value.trim()
      };

      try {
        // שליחה אל ה-Web App של Google
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // מאפשר שליחה תקינה ל-Google Script ללא חסימות CORS
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        // הצלחה
        statusMsg.className = 'form-status success';
        statusMsg.textContent = '✅ הודעתך נשלחה בהצלחה! צוות האתר ישיב בהקדם לכתובת המייל שציינת.';
        form.reset();
      } catch (err) {
        statusMsg.className = 'form-status error';
        statusMsg.textContent = '⚠️ אירעה שגיאה בשליחת הטופס. אנא פנו ישירות לכתובת המייל של האתר.';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>📨</span> שלח הודעה';
      }
    });
  </script>
</body>
</html>
